; Temporary mitigation for PHP2Shell (CVE-2026-109618, CVE-2026-109619) until PHP >= 8.5.12 is available
; in the Sail image. Reduces exposure only; the real fix is upgrading PHP. Remove once `sail php -v` shows 8.5.12+.
; Loaded after 99-sail.ini (alphabetical order), so these values win.
memory_limit = -1
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
